<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAIZ SOOQ - Executive Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Supabase JS Client for Realtime Global Data Sync -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0D1B2A] text-[#E2E8F0] font-sans antialiased pb-24 selection:bg-[#2ECC71] selection:text-black">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Supabase Configuration for Shared Realtime Sync
    const SUPABASE_URL = 'https://YOUR_SUPABASE_URL.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabaseClient = (SUPABASE_URL && SUPABASE_URL !== 'https://YOUR_SUPABASE_URL.supabase.co') 
      ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) 
      : null;

    function KaizSooqApp() {
      const [view, setView] = useState('dashboard');
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);
      const [brandFilter, setBrandFilter] = useState('All');
      const [orders, setOrders] = useState([]);
      const [items, setItems] = useState([]);
      const [editingOrderId, setEditingOrderId] = useState(null);
      const [expandedCustomerId, setExpandedCustomerId] = useState(null);

      // Tailor WhatsApp Clicked Order State (Tracks orders where tailor button was clicked to show only customer name initially)
      const [sentTailorOrders, setSentTailorOrders] = useState({});

      // Auth State
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [showLoginModal, setShowLoginModal] = useState(false);

      // Report Dates
      const [fromDate, setFromDate] = useState('');
      const [toDate, setToDate] = useState('');

      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      const initialFormState = {
        brand: 'Ledi',
        customerName: '',
        whatsapp: '',
        sellingPrice: '',
        advanceAmount: '',
        materialRate: '',
        stitchingCharge: '',
        shippingCharge: '',
        tailorName: 'Ani Mol',
        address: '',
        pincode: '',
        courier: 'DTDC',
        trackingNo: '',
        dressName: '',
        age: '',
        isStandardMeasurement: false,
        dressLength: '', bust: '', waist: '', hip: '', shoulder: '', sleeveLength: '', neck: '', armhole: '',
        deliveryDate: '',
        isAdvPaid: false,
        isFullyPaid: false
      };

      const [formData, setFormData] = useState(initialFormState);
      
      const initialItemState = { 
        name: '', materialName: '', modelName: '', designName: '', category: 'Fabric', brand: 'Ledi', stock: '', price: '', photoUrl: '' 
      };
      const [itemForm, setItemForm] = useState(initialItemState);

      // Fetch Initial Data & Setup Supabase Realtime / LocalStorage Fallback
      useEffect(() => {
        const fetchInitialData = async () => {
          if (supabaseClient) {
            try {
              const { data: ordData } = await supabaseClient.from('kaiz_orders').select('*').order('id', { ascending: false });
              if (ordData && ordData.length > 0) setOrders(ordData);

              const { data: itemData } = await supabaseClient.from('kaiz_items').select('*').order('id', { ascending: false });
              if (itemData && itemData.length > 0) setItems(itemData);
            } catch (err) {
              console.log('Supabase fetch fallback to local storage', err);
            }
          }

          // Fallback or Initial Load from localStorage if Supabase is unconfigured
          const saved = localStorage.getItem('kaiz_orders');
          if (saved && (!orders.length)) setOrders(JSON.parse(saved));
          const savedItems = localStorage.getItem('kaiz_items');
          if (savedItems && (!items.length)) setItems(JSON.parse(savedItems));
          const savedTailorClicks = localStorage.getItem('kaiz_sent_tailor');
          if (savedTailorClicks) setSentTailorOrders(JSON.parse(savedTailorClicks));
        };

        fetchInitialData();

        // Setup Realtime Subscription if Supabase is configured
        if (supabaseClient) {
          const orderSubscription = supabaseClient
            .channel('public:kaiz_orders')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'kaiz_orders' }, payload => {
              // Refresh orders on any remote modification
              supabaseClient.from('kaiz_orders').select('*').order('id', { ascending: false }).then(({ data }) => {
                if (data) setOrders(data);
              });
            })
            .subscribe();

          const itemSubscription = supabaseClient
            .channel('public:kaiz_items')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'kaiz_items' }, payload => {
              supabaseClient.from('kaiz_items').select('*').order('id', { ascending: false }).then(({ data }) => {
                if (data) setItems(data);
              });
            })
            .subscribe();

          return () => {
            supabaseClient.removeChannel(orderSubscription);
            supabaseClient.removeChannel(itemSubscription);
          };
        }
      }, []);

      const handleLogin = (e) => {
        e.preventDefault();
        if (loginUser === 'kaiz sooq' && loginPass === 'kaiz2024') {
          setIsLoggedIn(true);
          setShowLoginModal(false);
          alert('Owner Login Successful!');
        } else {
          alert('Invalid Username or Password!');
        }
      };

      const checkAuthAndAction = (action) => {
        if (!isLoggedIn) {
          setShowLoginModal(true);
        } else {
          action();
        }
      };

      const saveOrdersToStorage = async (updatedOrders) => {
        setOrders(updatedOrders);
        localStorage.setItem('kaiz_orders', JSON.stringify(updatedOrders));
        if (supabaseClient) {
          // Sync with Supabase table if configured
          try {
            // Clear and bulk insert or upsert individual
            for (let ord of updatedOrders) {
              await supabaseClient.from('kaiz_orders').upsert([ord]);
            }
          } catch (e) {
            console.error('Supabase orders sync error:', e);
          }
        }
      };

      const saveItemsToStorage = async (updatedItems) => {
        setItems(updatedItems);
        localStorage.setItem('kaiz_items', JSON.stringify(updatedItems));
        if (supabaseClient) {
          try {
            for (let itm of updatedItems) {
              await supabaseClient.from('kaiz_items').upsert([itm]);
            }
          } catch (e) {
            console.error('Supabase items sync error:', e);
          }
        }
      };

      const handleWhatsappChange = (waNum) => {
        setFormData(prev => ({ ...prev, whatsapp: waNum }));
        const existingOrder = orders.find(o => o.whatsapp === waNum);
        if (existingOrder && !editingOrderId) {
          setFormData(prev => ({
            ...prev,
            customerName: existingOrder.customerName,
            address: existingOrder.address,
            pincode: existingOrder.pincode
          }));
        }
      };

      const handleSellingPriceChange = (val) => {
        const sp = Number(val) || 0;
        const autoAdv = sp > 0 ? (sp * 0.5) : '';
        setFormData(prev => ({
          ...prev,
          sellingPrice: val,
          advanceAmount: autoAdv
        }));
      };

      const handleItemSelect = (itemName) => {
        const selected = items.find(i => i.name === itemName);
        if (selected) {
          const sp = Number(selected.price || 0);
          setFormData(prev => ({
            ...prev,
            dressName: selected.name,
            sellingPrice: selected.price,
            advanceAmount: sp > 0 ? (sp * 0.5) : prev.advanceAmount,
            brand: selected.brand || prev.brand
          }));
        } else {
          setFormData(prev => ({ ...prev, dressName: itemName }));
        }
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setItemForm(prev => ({ ...prev, photoUrl: reader.result }));
          };
          reader.readAsDataURL(file);
        }
      };

      const handleItemSubmit = (e) => {
        e.preventDefault();
        checkAuthAndAction(() => {
          if (!itemForm.name || !itemForm.price) {
            alert('Please enter Item Name and Price');
            return;
          }
          const updated = [{ ...itemForm, id: Date.now() }, ...items];
          saveItemsToStorage(updated);
          setItemForm(initialItemState);
          alert('Item Registered Successfully & Synced to Link Viewers!');
        });
      };

      const handleDeleteItem = async (id) => {
        checkAuthAndAction(async () => {
          if (confirm('Are you sure you want to delete this item?')) {
            const updated = items.filter(item => item.id !== id);
            saveItemsToStorage(updated);
            if (supabaseClient) {
              await supabaseClient.from('kaiz_items').delete().eq('id', id);
            }
          }
        });
      };

      const handleShareItem = (item) => {
        let msg = `✨ *${item.brand || 'KAIZ SOOQ'} New Arrival* ✨\n\n👗 *Item:* ${item.name}\n💰 *Price:* ₹${item.price}\n\n`;
        if (item.photoUrl) {
          msg += `🖼️ *Photo Link:* ${item.photoUrl}\n\n`;
        }
        msg += `_Contact KAIZ SOOQ to book your order now!_`;
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
      };

      const handleOrderSubmit = (e) => {
        e.preventDefault();
        checkAuthAndAction(() => {
          if (editingOrderId) {
            const updated = orders.map(o => o.id === editingOrderId ? { ...formData, id: editingOrderId } : o);
            saveOrdersToStorage(updated);
            alert('Order Updated & Synced to All Link Viewers!');
            setEditingOrderId(null);
          } else {
            const newOrder = { ...formData, id: Date.now() };
            saveOrdersToStorage([newOrder, ...orders]);
            alert('Order Saved & Synced to All Link Viewers!');
          }
          setFormData(initialFormState);
          setView('savedOrders');
        });
      };

      const handleEditOrder = (order) => {
        checkAuthAndAction(() => {
          setFormData(order);
          setEditingOrderId(order.id);
          setView('addOrder');
        });
      };

      const handleDeleteOrder = async (id) => {
        checkAuthAndAction(async () => {
          if (confirm('Are you sure you want to delete this order?')) {
            const updated = orders.filter(o => o.id !== id);
            saveOrdersToStorage(updated);
            if (supabaseClient) {
              await supabaseClient.from('kaiz_orders').delete().eq('id', id);
            }
          }
        });
      };

      // Tailor WhatsApp Dispatch with custom requested format & collapsing state
      const sendTailorWhatsApp = (tailorPhone, tailorName, order) => {
        const updatedClicks = { ...sentTailorOrders, [order.id]: true };
        setSentTailorOrders(updatedClicks);
        localStorage.setItem('kaiz_sent_tailor', JSON.stringify(updatedClicks));

        const msg = `Hello ${tailorName}, Thank you so much for your wonderful work! Your salary for this completed order has been credited. 🫂\n\nCredited amount 💸\nCustomer: ${order.customerName}\nDress: ${order.dressName}\nStitching: ₹${order.stitchingCharge || 0}\n\n*KAIZ SOOQ*`;
        window.open(`https://wa.me/91${tailorPhone}?text=${encodeURIComponent(msg)}`, '_blank');
      };

      const triggerWhatsApp = (type, order) => {
        const balance = order.isFullyPaid ? 0 : (Number(order.sellingPrice || 0) - Number(order.advanceAmount || 0));
        const brandHeader = order.brand;
        let msg = '';

        if (type === 'adv') {
          msg = `*${brandHeader} Order Confirmed!*\nHello ${order.customerName},\nYour order for *${order.dressName}* is confirmed.\n\n👗 *Dress Price:* ₹${order.sellingPrice || 0}\n💳 *Advance Paid:* ₹${order.advanceAmount || 0}\n💵 *Remaining Balance:* ₹${balance}\n📅 *Expected Delivery:* ${order.deliveryDate || 'N/A'}`;
          const updated = orders.map(o => o.id === order.id ? { ...o, isAdvPaid: true } : o);
          saveOrdersToStorage(updated);

        } else if (type === 'remind') {
          msg = `*${brandHeader} Payment Reminder*\nHello ${order.customerName},\nThis is a reminder for your order: *${order.dressName}*\n\n👗 *Dress Price:* ₹${order.sellingPrice || 0}\n💳 *Advance Paid:* ₹${order.advanceAmount || 0}\n💵 *Pending Balance:* ₹${balance}\n\nPlease pay the remaining balance via GPay/PhonePe to:\n*Muhammedanas3010-1@oksbi*`;
        } else if (type === 'full') {
          msg = `*${brandHeader} Payment Confirmation*\nThank you ${order.customerName}.\nYour payment for *${order.dressName}* has been received in full.\n\n👗 *Dress Price:* ₹${order.sellingPrice || 0}\n✅ *Total Paid:* ₹${order.sellingPrice || 0}`;
          const updated = orders.map(o => o.id === order.id ? { ...o, isFullyPaid: true, advanceAmount: order.sellingPrice } : o);
          saveOrdersToStorage(updated);
        }

        msg += order.brand === 'Bebi' ? `\n\n*KAIZ SOOQ - be every baby’s ideal*` : `\n\n*KAIZ SOOQ*`;

        const targetPhone = order.whatsapp;
        window.open(`https://wa.me/91${targetPhone}?text=${encodeURIComponent(msg)}`, '_blank');
      };

      const sendDirectWhatsAppToClient = (phone, name) => {
        const msg = `Hello ${name},\nGreetings from *KAIZ SOOQ*! How can we help you today?`;
        window.open(`https://wa.me/91${phone}?text=${encodeURIComponent(msg)}`, '_blank');
      };

      const downloadReport = () => {
        let reportData = [...orders];

        if (fromDate && toDate) {
          reportData = reportData.filter(o => o.deliveryDate >= fromDate && o.deliveryDate <= toDate);
        }

        if (reportData.length === 0) {
          alert('No orders found for the selected criteria!');
          return;
        }

        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "Brand,Customer Name,WhatsApp,Dress Name,Price,Advance,Balance,Fully Paid,Delivery Date,Tailor\n";

        reportData.forEach(o => {
          const bal = o.isFullyPaid ? 0 : (Number(o.sellingPrice || 0) - Number(o.advanceAmount || 0));
          csvContent += `"${o.brand}","${o.customerName}","${o.whatsapp}","${o.dressName}",${o.sellingPrice},${o.advanceAmount},${bal},"${o.isFullyPaid ? 'YES' : 'NO'}","${o.deliveryDate}","${o.tailorName}"\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `KAIZ_SOOQ_Report_${fromDate || 'All'}_to_${toDate || 'All'}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const filteredOrders = brandFilter === 'All' ? orders : orders.filter(o => o.brand === brandFilter);
      const lediOrders = orders.filter(o => o.brand === 'Ledi');
      const bebiOrders = orders.filter(o => o.brand === 'Bebi');

      const totalLediCount = lediOrders.length;
      const totalBebiCount = bebiOrders.length;

      const lediFullPaid = lediOrders.filter(o => o.isFullyPaid).length;
      const bebiFullPaid = bebiOrders.filter(o => o.isFullyPaid).length;
      const totalFullPaid = orders.filter(o => o.isFullyPaid).length;

      const fullyPaidOrders = orders.filter(o => o.isFullyPaid);
      const filteredFullyPaid = filteredOrders.filter(o => o.isFullyPaid);

      const aniMolStitching = fullyPaidOrders.filter(o => o.tailorName === 'Ani Mol').reduce((sum, o) => sum + Number(o.stitchingCharge || 0), 0);
      const ummaStitching = fullyPaidOrders.filter(o => o.tailorName === 'Umma').reduce((sum, o) => sum + Number(o.stitchingCharge || 0), 0);
      const nusraStitching = fullyPaidOrders.filter(o => o.tailorName === 'Nusra').reduce((sum, o) => sum + Number(o.stitchingCharge || 0), 0);

      const calculateBrandFinancials = (brandOrders) => {
        let totalRevenue = 0;
        let totalProfit = 0;
        let totalExpense = 0;
        brandOrders.forEach(o => {
          const sp = Number(o.sellingPrice || 0);
          const exp = Number(o.materialRate || 0) + Number(o.stitchingCharge || 0) + Number(o.shippingCharge || 0);
          totalRevenue += sp;
          if (o.isFullyPaid) {
            totalExpense += exp;
            totalProfit += (sp - exp);
          }
        });
        return { totalRevenue, totalProfit, totalExpense };
      };

      const lediFinancials = calculateBrandFinancials(lediOrders);
      const bebiFinancials = calculateBrandFinancials(bebiOrders);

      const totalRevenueAll = filteredOrders.reduce((sum, o) => sum + Number(o.sellingPrice || 0), 0);

      const overallNetProfit = filteredFullyPaid.reduce((sum, o) => {
        const sp = Number(o.sellingPrice || 0);
        const cost = Number(o.materialRate || 0) + Number(o.stitchingCharge || 0) + Number(o.shippingCharge || 0);
        return sum + (sp - cost);
      }, 0);

      const uniqueCustomers = Array.from(new Set(orders.map(o => o.whatsapp))).map(key => {
        return orders.find(o => o.whatsapp === key);
      }).filter(Boolean);

      const nextUpcoming = [...orders]
        .filter(o => o.deliveryDate && !o.isFullyPaid)
        .sort((a, b) => new Date(a.deliveryDate) - new Date(b.deliveryDate))[0];

      const currentFormPrice = Number(formData.sellingPrice || 0);
      const currentFormExp = Number(formData.materialRate || 0) + Number(formData.stitchingCharge || 0) + Number(formData.shippingCharge || 0);
      const currentFormProfit = currentFormPrice - currentFormExp;

      return (
        <div className="min-h-screen">

          {/* Header Bar */}
          <header className="bg-[#1B2A4A] text-[#E2E8F0] p-4 sticky top-0 z-50 flex justify-between items-center border-b border-gray-800 shadow-md">
            <div className="flex items-center gap-3">
              <button onClick={() => setIsSidebarOpen(true)} className="text-2xl text-[#2ECC71]">☰</button>
              <div>
                <h1 className="font-black text-lg tracking-wider text-white">KAIZ SOOQ</h1>
                <p className="text-[10px] text-gray-400">
                  {isLoggedIn ? '🔑 Owner Mode Active' : '👁️ View Only Mode (Shared Live Link)'}
                </p>
              </div>
            </div>
            
            <div className="flex items-center gap-2">
              {!isLoggedIn ? (
                <button onClick={() => setShowLoginModal(true)} className="bg-[#2ECC71] text-black font-bold text-xs px-2.5 py-1 rounded-lg">
                  Owner Login
                </button>
              ) : (
                <button onClick={() => setIsLoggedIn(false)} className="bg-red-500/20 text-red-400 border border-red-500/30 text-xs px-2 py-1 rounded-lg font-bold">
                  Logout
                </button>
              )}

              <select value={brandFilter} onChange={(e) => setBrandFilter(e.target.value)} className="bg-[#0D1B2A] text-[#2ECC71] border border-[#2ECC71] rounded-lg px-2 py-1 text-xs font-bold outline-none">
                <option value="All">All Brands</option>
                <option value="Ledi">Ledi Wear</option>
                <option value="Bebi">Bebi Wear</option>
              </select>
            </div>
          </header>

          {/* Owner Login Modal */}
          {showLoginModal && (
            <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <form onSubmit={handleLogin} className="bg-[#1B2A4A] border border-gray-800 p-5 rounded-2xl w-full max-w-xs space-y-4 shadow-2xl">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-white text-base">Owner Verification</h3>
                  <button type="button" onClick={() => setShowLoginModal(false)} className="text-gray-400 font-bold">✕</button>
                </div>
                <div className="space-y-2">
                  <input type="text" placeholder="Username" value={loginUser} onChange={(e) => setLoginUser(e.target.value)} required className="w-full p-2.5 text-xs bg-[#0D1B2A] border border-gray-800 rounded-lg text-white outline-none focus:border-[#2ECC71]" />
                  <input type="password" placeholder="Password" value={loginPass} onChange={(e) => setLoginPass(e.target.value)} required className="w-full p-2.5 text-xs bg-[#0D1B2A] border border-gray-800 rounded-lg text-white outline-none focus:border-[#2ECC71]" />
                </div>
                <button type="submit" className="w-full bg-[#2ECC71] text-black font-extrabold py-2.5 rounded-lg text-xs">
                  Authenticate Owner
                </button>
              </form>
            </div>
          )}

          {/* Sidebar Drawer */}
          {isSidebarOpen && (
            <div className="fixed inset-0 bg-black/70 z-50 flex backdrop-blur-sm">
              <div className="bg-[#1B2A4A] w-64 p-5 h-full flex flex-col justify-between shadow-2xl border-r border-gray-800">
                <div>
                  <div className="flex justify-between items-center mb-6">
                    <h2 className="font-bold text-lg text-[#2ECC71]">Menu Navigation</h2>
                    <button onClick={() => setIsSidebarOpen(false)} className="text-xl font-bold text-gray-400">✕</button>
                  </div>
                  <nav className="flex flex-col gap-3 font-semibold text-gray-300">
                    <button onClick={() => { setView('dashboard'); setIsSidebarOpen(false); }} className="text-left p-2 hover:bg-[#0D1B2A] hover:text-[#2ECC71] rounded-lg transition">🏠 Dashboard</button>
                    <button onClick={() => { setView('analytics'); setIsSidebarOpen(false); }} className="text-left p-2 hover:bg-[#0D1B2A] hover:text-[#2ECC71] rounded-lg transition">📊 Business Graph & Analytics</button>
                    <button onClick={() => { checkAuthAndAction(() => { setEditingOrderId(null); setFormData(initialFormState); setView('addOrder'); setIsSidebarOpen(false); }); }} className="text-left p-2 hover:bg-[#0D1B2A] hover:text-[#2ECC71] rounded-lg transition">➕ Create New Order</button>
                    <button onClick={() => { setView('savedOrders'); setIsSidebarOpen(false); }} className="text-left p-2 hover:bg-[#0D1B2A] hover:text-[#2ECC71] rounded-lg transition">📜 Saved Orders History</button>
                    <button onClick={() => { setView('customers'); setIsSidebarOpen(false); }} className="text-left p-2 hover:bg-[#0D1B2A] hover:text-[#2ECC71] rounded-lg transition">👤 Customer Directory</button>
                    <button onClick={() => { setView('items'); setIsSidebarOpen(false); }} className="text-left p-2 hover:bg-[#0D1B2A] hover:text-[#2ECC71] rounded-lg transition">👗 Store Inventory</button>
                    <button onClick={() => { setView('reports'); setIsSidebarOpen(false); }} className="text-left p-2 hover:bg-[#0D1B2A] hover:text-[#2ECC71] rounded-lg transition">📥 Reports & Downloads</button>
                  </nav>
                </div>
                <div className="text-[10px] text-gray-500">KAIZ SOOQ v4.0 - Live Shared Cloud</div>
              </div>
              <div className="flex-1" onClick={() => setIsSidebarOpen(false)}></div>
            </div>
          )}

          {/* MAIN CONTAINER */}
          <main className="p-4 max-w-md mx-auto space-y-5">

            {/* VIEW 1: DASHBOARD */}
            {view === 'dashboard' && (
              <>
                <div className="bg-gradient-to-br from-[#1B2A4A] to-[#0F172A] rounded-2xl p-5 border border-gray-800 shadow-xl relative overflow-hidden space-y-3">
                  <div className="flex justify-between items-center">
                    <span className="text-xs uppercase tracking-wider font-semibold text-gray-400">Net Profit & Revenue</span>
                  </div>
                  
                  <div className="grid grid-cols-2 gap-2 pt-1 border-b border-gray-800 pb-3">
                    <div>
                      <div className="text-[10px] text-gray-400 uppercase font-bold">Total Profit (Paid)</div>
                      <div className="text-3xl font-extrabold text-[#2ECC71] tracking-tight">₹{overallNetProfit.toLocaleString()}</div>
                    </div>
                    <div>
                      <div className="text-[10px] text-gray-400 uppercase font-bold">Total Revenue</div>

                              </button>
                            )}
                            
                            <button onClick={() => triggerWhatsApp('full', order)} title="Next Delivery / Complete" className="bg-[#0D1B2A] hover:border-blue-400 text-blue-400 border border-gray-800 py-1.5 px-1 rounded-lg font-bold flex items-center justify-center gap-1">
                              📅
                            </button>
                          </div>
                        )}

                        {/* Tailor WhatsApp Buttons with requested new message format - Hidden once clicked */}
                        {order.isFullyPaid && !isTailorSent && (
                          <div className="pt-2 border-t border-gray-800 space-y-1">
                            <div className="text-[10px] text-gray-400 font-bold">Send to Tailor WhatsApp:</div>
                            <div className="grid grid-cols-3 gap-1">
                              <button onClick={() => sendTailorWhatsApp('8943349582', 'Umma', order)} className="bg-[#25D366]/20 text-[#25D366] border border-[#25D366]/40 py-1 px-1 rounded font-bold text-[10px]">
                                Send to Umma
                              </button>
                              <button onClick={() => sendTailorWhatsApp('9995549582', 'Ani mol', order)} className="bg-[#25D366]/20 text-[#25D366] border border-[#25D366]/40 py-1 px-1 rounded font-bold text-[10px]">
                                Send to Ani mol
                              </button>
                              <button onClick={() => sendTailorWhatsApp('7510702526', 'Nursa', order)} className="bg-[#25D366]/20 text-[#25D366] border border-[#25D366]/40 py-1 px-1 rounded font-bold text-[10px]">
                                Send to Nursa
                              </button>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })
                )}
              </div>
            )}

            {/* VIEW 4: CUSTOMER DIRECTORY */}
            {view === 'customers' && (
              <div className="space-y-3">
                <h2 className="text-base font-bold text-white">Customer Directory (CRM)</h2>
                {uniqueCustomers.length === 0 ? (
                  <div className="text-center py-8 text-gray-500 text-xs">No client profile recorded.</div>
                ) : (
                  uniqueCustomers.map(customer => {
                    const custKey = customer.whatsapp;
                    const isExpanded = expandedCustomerId === custKey;
                    const customerOrders = orders.filter(o => o.whatsapp === custKey);

                    return (
                      <div key={custKey} className="bg-[#1B2A4A] rounded-xl border border-gray-800 overflow-hidden">
                        <div className="p-3 hover:bg-[#0D1B2A] flex justify-between items-center transition">
                          <div onClick={() => setExpandedCustomerId(isExpanded ? null : custKey)} className="cursor-pointer flex-1">
                            <div className="font-bold text-sm text-white">{customer.customerName}</div>
                            <div className="text-xs text-gray-400">💬 {customer.whatsapp}</div>
                          </div>
                          
                          <div className="flex items-center gap-2">
                            <button 
                              onClick={() => sendDirectWhatsAppToClient(customer.whatsapp, customer.customerName)}
                              className="bg-[#2ECC71]/10 text-[#2ECC71] border border-[#2ECC71]/40 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1 hover:bg-[#2ECC71] hover:text-black transition"
                            >
                              💬 WhatsApp
                            </button>
                            <button onClick={() => setExpandedCustomerId(isExpanded ? null : custKey)} className="text-xs font-bold text-gray-400 p-1">
                              {isExpanded ? '▲' : '▼'}
                            </button>
                          </div>
                        </div>

                        {isExpanded && (
                          <div className="p-3 bg-[#0D1B2A] space-y-3 text-xs border-t border-gray-800">
                            <div className="bg-[#1B2A4A] p-2.5 rounded-lg border border-gray-800 space-y-1">
                              <div className="font-bold text-[#2ECC71]">Address Info</div>
                              <div className="text-gray-300">📍 {customer.address || 'No Address saved'}</div>
                              <div className="text-gray-400">📮 Pincode: {customer.pincode || 'N/A'}</div>
                            </div>

                            <div className="space-y-2">
                              <div className="font-bold text-gray-400">History Log:</div>
                              {customerOrders.map(ord => (
                                <div key={ord.id} className="bg-[#1B2A4A] p-2 rounded border border-gray-800 space-y-1">
                                  <div className="flex justify-between font-bold">
                                    <span className="text-white">{ord.dressName} ({ord.brand})</span>
                                    <span className="text-[#2ECC71]">₹{ord.sellingPrice}</span>
                                  </div>
                                  <div className="text-gray-400 text-[10px]">Delivery: {ord.deliveryDate || 'N/A'} | Tailor: {ord.tailorName || 'Ani Mol'}</div>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })
                )}
              </div>
            )}

            {/* VIEW 5: ITEM STORE / INVENTORY */}
            {view === 'items' && (
              <div className="space-y-3">
                <h2 className="text-base font-bold text-white">Item Store / Inventory</h2>
                
                <form onSubmit={handleItemSubmit} className="bg-[#1B2A4A] p-3 rounded-xl border border-gray-800 space-y-2.5">
                  <h3 className="text-xs font-bold text-[#2ECC71]">[+] Register New Inventory Item</h3>
                  
                  <div>
                    <label className="text-[10px] text-gray-400 font-bold">Select Target Brand</label>
                    <select value={itemForm.brand} onChange={(e) => setItemForm({ ...itemForm, brand: e.target.value })} className="w-full p-2 text-xs bg-[#0D1B2A] border border-gray-800 rounded text-white mt-1">
                      <option value="Ledi">Ledi Wear</option>
                      <option value="Bebi">Bebi Wear</option>
                    </select>
                  </div>

                  <input type="text" placeholder="Item Name / Code *" value={itemForm.name} onChange={(e) => setItemForm({ ...itemForm, name: e.target.value })} required className="w-full p-2 text-xs bg-[#0D1B2A] border border-gray-800 rounded text-white" />
                  <input type="number" placeholder="Price (₹) *" value={itemForm.price} onChange={(e) => setItemForm({ ...itemForm, price: e.target.value })} required className="w-full p-2 text-xs bg-[#0D1B2A] border border-gray-800 rounded text-white" />

                  {/* Image Upload Option */}
                  <div className="space-y-1">
                    <label className="text-[10px] text-gray-400 font-bold">Item Image (Upload File or Paste Image URL)</label>
                    <input type="file" accept="image/*" onChange={handleImageUpload} className="w-full text-xs text-gray-400 bg-[#0D1B2A] p-1.5 rounded border border-gray-800" />
                    <input type="text" placeholder="Or Image Link URL" value={itemForm.photoUrl} onChange={(e) => setItemForm({ ...itemForm, photoUrl: e.target.value })} className="w-full p-2 text-xs bg-[#0D1B2A] border border-gray-800 rounded text-white" />
                    {itemForm.photoUrl && (
                      <div className="mt-1 flex justify-center">
                        <img src={itemForm.photoUrl} alt="Preview" className="h-16 w-16 object-cover rounded-lg border border-gray-700" />
                      </div>
                    )}
                  </div>

                  <button type="submit" className="w-full bg-[#2ECC71] text-black font-extrabold py-2 rounded text-xs transition hover:bg-[#27ae60]">
                    Save Item to Inventory
                  </button>
                </form>

                <div className="grid grid-cols-2 gap-3">
                  {items.map(item => (
                    <div key={item.id} className="bg-[#1B2A4A] p-3 rounded-xl border border-gray-800 space-y-2 flex flex-col justify-between shadow-md">
                      <div>
                        {item.photoUrl && (
                          <img src={item.photoUrl} alt={item.name} className="w-full h-24 object-cover rounded-lg mb-2 border border-gray-800" />
                        )}
                        <div className="flex justify-between items-start">
                          <h4 className="text-xs font-bold text-white line-clamp-1">{item.name}</h4>
                          <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded text-white ${item.brand === 'Ledi' ? 'bg-blue-600' : 'bg-purple-600'}`}>
                            {item.brand || 'Ledi'}
                          </span>
                        </div>
                        <div className="text-xs text-[#2ECC71] font-extrabold mt-1">₹{item.price}</div>
                      </div>

                      <div className="space-y-1 pt-2 border-t border-gray-800">
                        <button onClick={() => handleShareItem(item)} className="w-full text-[10px] bg-[#2ECC71]/10 text-[#2ECC71] border border-[#2ECC71]/30 py-1 rounded font-bold hover:bg-[#2ECC71] hover:text-black transition">
                          📤 Share Item
                        </button>
                        <button onClick={() => handleDeleteItem(item.id)} className="w-full text-[10px] text-[#E74C3C] hover:underline text-center block pt-0.5">
                          Delete Item
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW 6: BUSINESS GRAPH & ANALYTICS */}
            {view === 'analytics' && (
              <div className="bg-[#1B2A4A] p-4 rounded-2xl border border-gray-800 space-y-4">
                <h2 className="text-base font-bold text-white border-b border-gray-800 pb-2">📊 Business Performance Graph</h2>
                <p className="text-xs text-gray-400">Live analytics across all shared link viewers.</p>
                <div className="bg-[#0D1B2A] p-3 rounded-xl border border-gray-800 text-center text-xs text-gray-300">
                  Total Orders Synchronized: <span className="text-[#2ECC71] font-bold">{orders.length}</span>
                </div>
              </div>
            )}

            {/* VIEW 7: REPORTS & CSV DOWNLOAD */}
            {view === 'reports' && (
              <div className="bg-[#1B2A4A] p-4 rounded-2xl border border-gray-800 space-y-4">
                <h2 className="text-base font-bold text-white border-b border-gray-800 pb-2">📥 Download Business Reports</h2>
                <p className="text-xs text-gray-400">Export order records to Excel/CSV. Filter by delivery dates if needed.</p>

                <div className="space-y-3 bg-[#0D1B2A] p-3 rounded-xl border border-gray-800">
                  <div>
                    <label className="text-[10px] font-bold text-gray-400">From Date</label>
                    <input type="date" value={fromDate} onChange={(e) => setFromDate(e.target.value)} className="w-full p-2 text-xs bg-[#1B2A4A] border border-gray-800 rounded text-white mt-1" />
                  </div>
                  <div>
                    <label className="text-[10px] font-bold text-gray-400">To Date</label>
                    <input type="date" value={toDate} onChange={(e) => setToDate(e.target.value)} className="w-full p-2 text-xs bg-[#1B2A4A] border border-gray-800 rounded text-white mt-1" />
                  </div>
                  
                  <div className="flex gap-2 pt-2">
                    <button onClick={() => { setFromDate(''); setToDate(''); }} className="w-1/3 bg-gray-800 text-gray-300 text-xs py-2 rounded-lg font-bold">Clear Dates</button>
                    <button onClick={downloadReport} className="w-2/3 bg-[#2ECC71] text-black font-extrabold text-xs py-2 rounded-lg">Download CSV Report</button>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* FLOATING BOTTOM NAVIGATION BAR */}
          <nav className="fixed bottom-0 left-0 right-0 bg-[#1B2A4A] border-t border-gray-800 py-3 px-6 flex justify-around items-center z-40 shadow-2xl">
            <button onClick={() => setView('dashboard')} className={`flex flex-col items-center gap-1 ${view === 'dashboard' ? 'text-[#2ECC71]' : 'text-gray-400'}`}>
              <span className="text-lg">🏠</span>
              <span className="text-[10px] font-bold">Home</span>
            </button>
            <button onClick={() => setView('savedOrders')} className={`flex flex-col items-center gap-1 ${view === 'savedOrders' ? 'text-[#2ECC71]' : 'text-gray-400'}`}>
              <span className="text-lg">📜</span>
              <span className="text-[10px] font-bold">Orders</span>
            </button>
            <button onClick={() => setView('customers')} className={`flex flex-col items-center gap-1 ${view === 'customers' ? 'text-[#2ECC71]' : 'text-gray-400'}`}>
              <span className="text-lg">👥</span>
              <span className="text-[10px] font-bold">Clients</span>
            </button>
            <button onClick={() => setView('analytics')} className={`flex flex-col items-center gap-1 ${view === 'analytics' ? 'text-[#2ECC71]' : 'text-gray-400'}`}>
              <span className="text-lg">📊</span>
              <span className="text-[10px] font-bold">Graph</span>
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.render(<KaizSooqApp />, document.getElementById('root'));
  </script>
</body>
</html>
