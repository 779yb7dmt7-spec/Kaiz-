<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAIZ SOOQ - Live Realtime Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-[#0D1B2A] text-[#E2E8F0] font-sans antialiased pb-24 selection:bg-[#2ECC71] selection:text-black">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // -------------------------------------------------------------------
    // FIREBASE CONFIGURATION (നിങ്ങളുടെ Firebase Config ഇവിടെ നൽകുക)
    // -------------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Firebase Initialize ചെയ്യുക
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    function KaizSooqApp() {
      const [view, setView] = useState('dashboard');
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);
      const [brandFilter, setBrandFilter] = useState('All');
      const [orders, setOrders] = useState([]);
      const [activityLogs, setActivityLogs] = useState([]);
      const [editingOrderId, setEditingOrderId] = useState(null);
      const [selectedOrderDetails, setSelectedOrderDetails] = useState(null);

      // Search & Filter State
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('All');

      // Auth State
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [showLogsModal, setShowLogsModal] = useState(false);

      // Report Dates
      const [fromDate, setFromDate] = useState('');
      const [toDate, setToDate] = useState('');

      const TAILOR_NUMBERS = {
        'Umma': '918943887325',
        'Ani Mol': '919995549582',
        'Nusrath': '917510702526'
      };

      const initialFormState = {
        brand: 'Ledi',
        customerName: '',
        whatsapp: '',
        address: '',
        dressName: '', deliveryDate: '',
        sellingPrice: '', advanceAmount: '', materialRate: '', stitchingCharge: '', tailorName: 'Ani Mol', shippingCharge: '',
        isAdvPaid: false,
        isFullyPaid: false,
        isTailorNotified: false
      };

      const [formData, setFormData] = useState(initialFormState);

      // -------------------------------------------------------------------
      // REALTIME DATABASE SYNC (എല്ലാവരുടെയും സ്ക്രീനിൽ തത്സമയം മാറാൻ)
      // -------------------------------------------------------------------
      useEffect(() => {
        // Orders Live Sync
        const ordersRef = db.ref('orders');
        ordersRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            const loadedOrders = Object.keys(data).map(key => ({
              ...data[key],
              id: key
            }));
            setOrders(loadedOrders.reverse());
          } else {
            setOrders([]);
          }
        });

        // Logs Live Sync
        const logsRef = db.ref('logs');
        logsRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            const loadedLogs = Object.keys(data).map(key => ({
              ...data[key],
              id: key
            }));
            setActivityLogs(loadedLogs.reverse());
          } else {
            setActivityLogs([]);
          }
        });

        return () => {
          ordersRef.off();
          logsRef.off();
        };
      }, []);

      const addLog = (title, details, type = 'info') => {
        const now = new Date();
        const timeString = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const newLog = {
          time: timeString,
          title,
          details,
          type
        };
        db.ref('logs').push(newLog);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (loginUser === 'kaiz sooq' && loginPass === 'kaiz2024') {
          setIsLoggedIn(true);
          setShowLoginModal(false);
          addLog("Owner Login Successful", "Owner accessed admin mode", "success");
          alert('Owner Login Successful!');
        } else {
          alert('Invalid Username or Password!');
        }
      };

      const checkAuthAndAction = (action) => {
        if (!isLoggedIn) {
          setShowLoginModal(true);
        } else {
          action();
        }
      };

      const handleOrderSubmit = (e) => {
        e.preventDefault();
        checkAuthAndAction(() => {
          const sp = Number(formData.sellingPrice) || 0;
          const exp = (Number(formData.materialRate) || 0) + (Number(formData.stitchingCharge) || 0) + (Number(formData.shippingCharge) || 0);
          const profit = sp - exp;

          if (editingOrderId) {
            db.ref(`orders/${editingOrderId}`).update(formData);
            addLog("Order Updated ✏️", `Customer: ${formData.customerName} | Profit: ₹${profit}`, "warning");
            alert('Order Updated Successfully Live!');
            setEditingOrderId(null);
          } else {
            const newRef = db.ref('orders').push();
            newRef.set(formData);
            addLog("New Order Created 🆕", `Customer: ${formData.customerName} (${formData.brand}) | Revenue: ₹${sp} | Profit: ₹${profit}`, "success");
            alert('New Order Saved Live!');
          }
          setFormData(initialFormState);
          setView('savedOrders');
        });
      };

      const handleEditOrder = (order) => {
        checkAuthAndAction(() => {
          setFormData(order);
          setEditingOrderId(order.id);
          setSelectedOrderDetails(null);
          setView('addOrder');
        });
      };

      const handleDeleteOrder = (id) => {
        checkAuthAndAction(() => {
          const target = orders.find(o => o.id === id);
          if (confirm('Are you sure you want to delete this order live?')) {
            db.ref(`orders/${id}`).remove();
            if (target) {
              addLog("Order Deleted 🗑️", `Removed Order: ${target.customerName} (${target.dressName})`, "danger");
            }
            if (selectedOrderDetails && selectedOrderDetails.id === id) {
              setSelectedOrderDetails(null);
            }
          }
        });
      };

      const triggerWhatsApp = (type, order) => {
        const rawTargetPhone = order.whatsapp || '';
        if (!rawTargetPhone) {
          alert('WhatsApp number not found!');
          return;
        }

        let cleanPhone = rawTargetPhone.replace(/[^0-9]/g, '');
        if (cleanPhone.length === 10) cleanPhone = '91' + cleanPhone;

        const balance = order.isFullyPaid ? 0 : (Number(order.sellingPrice || 0) - Number(order.advanceAmount || 0));
        const brandHeader = order.brand === 'Bebi' ? 'BEBI WEAR' : 'LEDI WEAR';
        let msg = '';

        if (type === 'adv') {
          msg = `*${brandHeader} - Order Confirmed! 🎉*\n\nHello *${order.customerName}*,\nYour order for *${order.dressName}* has been confirmed.\n\n👗 *Price:* ₹${order.sellingPrice || 0}\n💳 *Advance:* ₹${order.advanceAmount || 0}\n💵 *Balance:* ₹${balance}\n📅 *Delivery:* ${order.deliveryDate}`;
          db.ref(`orders/${order.id}`).update({ isAdvPaid: true });
          addLog("Advance Info Sent 💳", `Advance Message sent to ${order.customerName}`, "info");

        } else if (type === 'remind') {
          msg = `*${brandHeader} - Payment Reminder 🔔*\n\nHello *${order.customerName}*,\nPayment reminder for *${order.dressName}*.\n\n💵 *Pending Balance:* ₹${balance}\n\nGPay/PhonePe:\n👉 *Muhammedanas3010-1@oksbi*`;
          addLog("Payment Reminder Sent 🔔", `Reminder sent to ${order.customerName} for Balance ₹${balance}`, "warning");

        } else if (type === 'full') {
          msg = `*${brandHeader} - Payment Received! ✅*\n\nHello *${order.customerName}*,\nPayment received for *${order.dressName}*.\n\n👗 *Amount:* ₹${order.sellingPrice || 0}\n✅ *Status:* Fully Paid`;
          db.ref(`orders/${order.id}`).update({ isFullyPaid: true, advanceAmount: order.sellingPrice });
          addLog("Order Completed ✅", `Full Payment Received from ${order.customerName} (Revenue: ₹${order.sellingPrice})`, "success");
        }

        msg += order.brand === 'Bebi' ? `\n\n*KAIZ SOOQ - Be Every Baby’s Ideal*` : `\n\n*KAIZ SOOQ*`;
        window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
      };

      const triggerTailorWhatsApp = (order) => {
        const tailorName = order.tailorName || 'Ani Mol';
        const stitchingCharge = order.stitchingCharge || 0;
        const targetNumber = TAILOR_NUMBERS[tailorName] || TAILOR_NUMBERS['Ani Mol'];
        
        const msg = `Hello ${tailorName},\n\nWork completed for *${order.dressName}* (Customer: *${order.customerName}*).\n\nStitching charge of *₹${stitchingCharge}* credited.\n\nBest regards,\n*KAIZ SOOQ*`;

        db.ref(`orders/${order.id}`).update({ isTailorNotified: true });
        addLog("Tailor Credited 🧵", `₹${stitchingCharge} Stitching Fee Credited to ${tailorName}`, "info");

        window.open(`https://wa.me/${targetNumber}?text=${encodeURIComponent(msg)}`, '_blank');
      };

      const filteredOrdersByBrand = brandFilter === 'All' ? orders : orders.filter(o => o.brand === brandFilter);
      
      const searchedAndFilteredOrders = filteredOrdersByBrand.filter(o => {
        const matchesSearch = (o.customerName || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (o.whatsapp || '').includes(searchQuery) ||
                              (o.dressName || '').toLowerCase().includes(searchQuery.toLowerCase());
        
        if (statusFilter === 'Pending') return matchesSearch && !o.isFullyPaid;
        if (statusFilter === 'Completed') return matchesSearch && o.isFullyPaid;
        return matchesSearch;
      });

      const overallTotalRevenue = filteredOrdersByBrand.reduce((sum, o) => sum + Number(o.sellingPrice || 0), 0);
      const overallNetProfit = filteredOrdersByBrand.reduce((sum, o) => {
        const sp = Number(o.sellingPrice || 0);
        const cost = Number(o.materialRate || 0) + Number(o.stitchingCharge || 0) + Number(o.shippingCharge || 0);
        return sum + (sp - cost);
      }, 0);

      const activeOrdersCount = orders.filter(o => !o.isFullyPaid).length;

      return (
        <div className="min-h-screen">

          {/* Top Live Bar */}
          <header className="bg-[#1B2A4A] text-[#E2E8F0] p-4 sticky top-0 z-50 flex justify-between items-center border-b border-gray-800 shadow-md">
            <div className="flex items-center gap-3">
              <button onClick={() => setIsSidebarOpen(true)} className="text-2xl text-[#2ECC71]">☰</button>
              <div>
                <h1 className="font-black text-lg tracking-wider text-white">KAIZ SOOQ</h1>
                <p className="text-[10px] text-gray-400">
                  {isLoggedIn ? '🔑 Owner Live Mode' : '👁️ View Only Live Mode'}
                </p>
              </div>
            </div>
            
            <div className="flex items-center gap-2">
              <span className="flex h-2 w-2 relative">
                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#2ECC71] opacity-75"></span>
                <span className="relative inline-flex rounded-full h-2 w-2 bg-[#2ECC71]"></span>
              </span>
              <span className="text-[10px] text-[#2ECC71] font-bold uppercase tracking-wider">LIVE</span>

              {!isLoggedIn ? (
                <button onClick={() => setShowLoginModal(true)} className="bg-[#2ECC71] text-black font-bold text-xs px-2.5 py-1 rounded-lg ml-2">
                  Owner
                </button>
              ) : (
                <button onClick={() => setIsLoggedIn(false)} className="bg-red-500/20 text-red-400 border border-red-500/30 text-xs px-2 py-1 rounded-lg font-bold ml-2">
                  Logout
                </button>
              )}
            </div>
          </header>

          {/* Owner Verification Modal */}
          {showLoginModal && (
            <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <form onSubmit={handleLogin} className="bg-[#1B2A4A] border border-gray-800 p-5 rounded-2xl w-full max-w-xs space-y-4 shadow-2xl">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-white text-base">Owner Verification</h3>
                  <button type="button" onClick={() => setShowLoginModal(false)} className="text-gray-400 font-bold">✕</button>
                </div>
                <div className="space-y-2">
                  <input type="text" placeholder="Username" value={loginUser} onChange={(e) => setLoginUser(e.target.value)} required className="w-full p-2.5 text-xs bg-[#0D1B2A] border border-gray-800 rounded-lg text-white outline-none focus:border-[#2ECC71]" />
                  <input type="password" placeholder="Password" value={loginPass} onChange={(e) => setLoginPass(e.target.value)} required className="w-full p-2.5 text-xs bg-[#0D1B2A] border border-gray-800 rounded-lg text-white outline-none focus:border-[#2ECC71]" />
                </div>
                <button type="submit" className="w-full bg-[#2ECC71] text-black font-extrabold py-2.5 rounded-lg text-xs">
                  Authenticate Owner
                </button>
              </form>
            </div>
          )}

          {/* Main Dashboard */}
          <main className="p-4 max-w-md mx-auto space-y-5">
            {view === 'dashboard' && (
              <>
                <div className="bg-gradient-to-br from-[#1B2A4A] to-[#0F172A] rounded-2xl p-5 border border-gray-800 shadow-xl space-y-4">
                  <div className="flex justify-between items-center">
                    <span className="text-xs uppercase tracking-wider font-semibold text-gray-400">Real-Time Financials</span>
                    <span className="text-xs bg-[#2ECC71]/10 text-[#2ECC71] px-2 py-0.5 rounded font-mono font-bold border border-[#2ECC71]/30">Synced</span>
                  </div>
                  
                  <div className="grid grid-cols-2 gap-2 border-b border-gray-800 pb-3">
                    <div>
                      <div className="text-[11px] text-gray-400 font-bold uppercase">Total Revenue</div>
                      <div className="text-2xl font-black text-blue-400 mt-1">₹{overallTotalRevenue.toLocaleString()}</div>
                    </div>
                    <div>
                      <div className="text-[11px] text-gray-400 font-bold uppercase">Net Profit</div>
                      <div className="text-2xl font-black text-[#2ECC71] mt-1">₹{overallNetProfit.toLocaleString()}</div>
                    </div>
                  </div>
                  <p className="text-[11px] text-gray-400">All updates by the owner are reflected here in real time for everyone.</p>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <button onClick={() => checkAuthAndAction(() => { setEditingOrderId(null); setFormData(initialFormState); setView('addOrder'); })} className="bg-[#1B2A4A] p-4 rounded-xl border border-gray-800 flex flex-col items-center gap-1">
                    <span className="text-2xl">➕</span>
                    <span className="text-xs font-bold text-gray-300">Add Order</span>
                  </button>
                  <button onClick={() => setView('savedOrders')} className="bg-[#1B2A4A] p-4 rounded-xl border border-gray-800 flex flex-col items-center gap-1">
                    <span className="text-2xl">📜</span>
                    <span className="text-xs font-bold text-gray-300">View Orders ({orders.length})</span>
                  </button>
                </div>
              </>
            )}

            {/* View Orders & Add Orders views remain active */}
          </main>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<KaizSooqApp />);
  </script>
</body>
</html>
