<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAIZ SOOQ - Executive Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body class="bg-[#0D1B2A] text-[#E2E8F0] font-sans antialiased pb-24 selection:bg-[#2ECC71] selection:text-black">

  <div id="root"></div>

  <!-- Firebase Modular SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      onSnapshot, 
      doc, 
      setDoc, 
      deleteDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6dfOGbFdZTPyTrXpg_oA79CDyLZcW250",
      authDomain: "kaiz-sooq.firebaseapp.com",
      projectId: "kaiz-sooq",
      storageBucket: "kaiz-sooq.firebasestorage.app",
      messagingSenderId: "351947002124",
      appId: "1:351947002124:web:766e557c2b25a241d2f929"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.firestoreModule = { collection, onSnapshot, doc, setDoc, deleteDoc };
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function KaizSooqApp() {
      const [view, setView] = useState('dashboard');
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);
      const [items, setItems] = useState([]);
      const [editingItemId, setEditingItemId] = useState(null);
      const [selectedItemDetails, setSelectedItemDetails] = useState(null);

      // Search State
      const [searchQuery, setSearchQuery] = useState('');

      // Auth State
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [showLoginModal, setShowLoginModal] = useState(false);

      // Form State - Image, Model, Description options only
      const initialFormState = {
        image: '',
        model: '',
        description: ''
      };

      const [formData, setFormData] = useState(initialFormState);

      // Realtime Firebase Firestore Sync
      useEffect(() => {
        const checkAndSubscribe = () => {
          if (window.db && window.firestoreModule) {
            const { collection, onSnapshot } = window.firestoreModule;
            const itemsRef = collection(window.db, 'items');

            const unsubscribe = onSnapshot(itemsRef, (snapshot) => {
              const fetchedItems = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
              }));
              
              fetchedItems.sort((a, b) => Number(b.id) - Number(a.id));
              setItems(fetchedItems);
            }, (error) => {
              console.error("Firestore Listen Error:", error);
            });

            return unsubscribe;
          } else {
            setTimeout(checkAndSubscribe, 200);
          }
        };

        const unsubscribe = checkAndSubscribe();
        return () => { if (unsubscribe) unsubscribe(); };
      }, []);

      const handleLogin = (e) => {
        e.preventDefault();
        if (loginUser === 'kaiz sooq' && loginPass === 'kaiz2024') {
          setIsLoggedIn(true);
          setShowLoginModal(false);
          alert('Owner Login Successful!');
        } else {
          alert('Invalid Username or Password!');
        }
      };

      const checkAuthAndAction = (action) => {
        if (!isLoggedIn) {
          setShowLoginModal(true);
        } else {
          action();
        }
      };

      // Save or Update Item in Firestore
      const saveItemToFirestore = async (itemData) => {
        try {
          const { doc, setDoc } = window.firestoreModule;
          const itemId = String(itemData.id);
          await setDoc(doc(window.db, 'items', itemId), itemData);
        } catch (error) {
          console.error("Error saving to Firestore: ", error);
          alert("Error saving item: " + error.message);
        }
      };

      // Delete Item from Firestore
      const deleteItemFromFirestore = async (id) => {
        try {
          const { doc, deleteDoc } = window.firestoreModule;
          await deleteDoc(doc(window.db, 'items', String(id)));
        } catch (error) {
          console.error("Error deleting from Firestore: ", error);
          alert("Error deleting item: " + error.message);
        }
      };

      // Handle Image Upload and convert to Data URL
      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setFormData(prev => ({ ...prev, image: reader.result }));
          };
          reader.readAsDataURL(file);
        }
      };

      const handleItemSubmit = async (e) => {
        e.preventDefault();
        checkAuthAndAction(async () => {
          if (editingItemId) {
            const updatedItem = { ...formData, id: editingItemId };
            await saveItemToFirestore(updatedItem);
            alert('Item Updated Successfully!');
            setEditingItemId(null);
          } else {
            const newItem = { ...formData, id: Date.now() };
            await saveItemToFirestore(newItem);
            alert('Item Saved Successfully!');
          }
          setFormData(initialFormState);
          setView('savedItems');
        });
      };

      const handleEditItem = (item) => {
        checkAuthAndAction(() => {
          setFormData(item);
          setEditingItemId(item.id);
          setSelectedItemDetails(null);
          setView('addItem');
        });
      };

      const handleDeleteItem = (id) => {
        checkAuthAndAction(async () => {
          if (confirm('Are you sure you want to delete this item?')) {
            await deleteItemFromFirestore(id);
            if (selectedItemDetails && selectedItemDetails.id === id) {
              setSelectedItemDetails(null);
            }
          }
        });
      };

      const searchedItems = items.filter(item => {
        return (item.model || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
               (item.description || '').toLowerCase().includes(searchQuery.toLowerCase());
      });

      return (
        <div className="min-h-screen">

          {/* Header Bar */}
          <header className="bg-[#1B2A4A] text-[#E2E8F0] p-4 sticky top-0 z-50 flex justify-between items-center border-b border-gray-800 shadow-md">
            <div className="flex items-center gap-3">
              <button onClick={() => setIsSidebarOpen(true)} className="text-2xl text-[#2ECC71]">☰</button>
              <div>
                <h1 className="font-black text-lg tracking-wider text-white">KAIZ SOOQ</h1>
                <p className="text-[10px] text-gray-400">
                  {isLoggedIn ? '🔑 Owner Mode Active' : '👁️ View Only Mode'}
                </p>
              </div>
            </div>
            
            <div className="flex items-center gap-2">
              {!isLoggedIn ? (
                <button onClick={() => setShowLoginModal(true)} className="bg-[#2ECC71] text-black font-bold text-xs px-2.5 py-1 rounded-lg">
                  Owner Login
                </button>
              ) : (
                <button onClick={() => setIsLoggedIn(false)} className="bg-red-500/20 text-red-400 border border-red-500/30 text-xs px-2 py-1 rounded-lg font-bold">
                  Logout
                </button>
              )}
            </div>
          </header>

          {/* Owner Login Modal */}
          {showLoginModal && (
            <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <form onSubmit={handleLogin} className="bg-[#1B2A4A] border border-gray-800 p-5 rounded-2xl w-full max-w-xs space-y-4 shadow-2xl">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-white text-base">Owner Verification</h3>
                  <button type="button" onClick={() => setShowLoginModal(false)} className="text-gray-400 font-bold">✕</button>
                </div>
                <div className="space-y-2">
                  <input type="text" placeholder="Username" value={loginUser} onChange={(e) => setLoginUser(e.target.value)} required className="w-full p-2.5 text-xs bg-[#0D1B2A] border border-gray-800 rounded-lg text-white outline-none focus:border-[#2ECC71]" />
                  <input type="password" placeholder="Password" value={loginPass} onChange={(e) => setLoginPass(e.target.value)} required className="w-full p-2.5 text-xs bg-[#0D1B2A] border border-gray-800 rounded-lg text-white outline-none focus:border-[#2ECC71]" />
                </div>
                <button type="submit" className="w-full bg-[#2ECC71] text-black font-extrabold py-2.5 rounded-lg text-xs">
                  Authenticate Owner
                </button>
              </form>
            </div>
          )}

          {/* Sidebar Drawer */}
          {isSidebarOpen && (
            <div className="fixed inset-0 bg-black/70 z-50 flex backdrop-blur-sm">
              <div className="bg-[#1B2A4A] w-64 p-5 h-full flex flex-col justify-between shadow-2xl border-r border-gray-800">
                <div>
                  <div className="flex justify-between items-center mb-6">
                    <h2 className="font-bold text-lg text-[#2ECC71]">Menu Navigation</h2>
                    <button onClick={() => setIsSidebarOpen(false)} className="text-xl font-bold text-gray-400">✕</button>
                  </div>
                  <nav className="flex flex-col gap-3 font-semibold text-gray-300">
                    <button onClick={() => { setView('dashboard'); setIsSidebarOpen(false); }} className="text-left p-2 hover:bg-[#0D1B2A] hover:text-[#2ECC71] rounded-lg transition">🏠 Dashboard</button>
                    <button onClick={() => { checkAuthAndAction(() => { setEditingItemId(null); setFormData(initialFormState); setView('addItem'); setIsSidebarOpen(false); }); }} className="text-left p-2 hover:bg-[#0D1B2A] hover:text-[#2ECC71] rounded-lg transition">➕ Add Item Store</button>
                    <button onClick={() => { setView('savedItems'); setIsSidebarOpen(false); }} className="text-left p-2 hover:bg-[#0D1B2A] hover:text-[#2ECC71] rounded-lg transition">📦 Store Items Catalog</button>
                  </nav>
                </div>
                <div className="text-[10px] text-gray-500">KAIZ SOOQ v3.6 - Item Store Active</div>
              </div>
              <div className="flex-1" onClick={() => setIsSidebarOpen(false)}></div>
            </div>
          )}

          {/* MAIN CONTAINER */}
          <main className="p-4 max-w-md mx-auto space-y-5">

            {/* VIEW 1: DASHBOARD */}
            {view === 'dashboard' && (
              <>
                <div className="bg-gradient-to-br from-[#1B2A4A] to-[#0F172A] rounded-2xl p-5 border border-gray-800 shadow-xl relative overflow-hidden space-y-4">
                  <div className="flex justify-between items-center">
                    <span className="text-xs uppercase tracking-wider font-semibold text-gray-400">Store Summary</span>
                    <span className="text-xs bg-[#2ECC71]/10 text-[#2ECC71] px-2 py-0.5 rounded font-mono font-bold border border-[#2ECC71]/30">Cloud Live</span>
                  </div>
                  
                  <div>
                    <div className="text-[11px] text-gray-400 font-bold uppercase">Total Items in Store</div>
                    <div className="text-3xl font-black text-[#2ECC71] mt-1">{items.length}</div>
                  </div>

                  <p className="text-[11px] text-gray-400">Real-time store management with Image, Model, and Description fields.</p>
                </div>

                <div className="space-y-2">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-gray-400">Primary Shortcuts</h3>
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={() => checkAuthAndAction(() => { setEditingItemId(null); setFormData(initialFormState); setView('addItem'); })} className="bg-[#1B2A4A] hover:border-[#2ECC71] p-4 rounded-xl border border-gray-800 flex flex-col items-center gap-2 transition group">
                      <span className="text-3xl group-hover:scale-110 transition">➕</span>
                      <span className="text-xs font-bold text-gray-300">Add Item</span>
                    </button>
                    <button onClick={() => setView('savedItems')} className="bg-[#1B2A4A] hover:border-[#2ECC71] p-4 rounded-xl border border-gray-800 flex flex-col items-center gap-2 transition group">
                      <span className="text-3xl group-hover:scale-110 transition">📦</span>
                      <span className="text-xs font-bold text-gray-300">View Items</span>
                    </button>
                  </div>
                </div>
              </>
            )}

            {/* VIEW 2: ADD / EDIT ITEM FORM */}
            {view === 'addItem' && (
              <form onSubmit={handleItemSubmit} className="bg-[#1B2A4A] p-4 rounded-2xl border border-gray-800 space-y-4">
                <h2 className="text-base font-bold text-white border-b border-gray-800 pb-2">
                  {editingItemId ? 'Edit Item Details' : 'Add Item to Store'}
                </h2>
                
                {/* 1. IMAGE UPLOAD OPTION */}
                <div className="space-y-2">
                  <label className="text-xs font-bold text-gray-400">1. Image Upload</label>
                  <input 
                    type="file" 
                    accept="image/*" 
                    onChange={handleImageUpload} 
                    className="w-full text-xs text-gray-300 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-[#2ECC71] file:text-black hover:file:bg-[#27ae60] cursor-pointer bg-[#0D1B2A] border border-gray-800 rounded-lg p-1"
                  />
                  {formData.image && (
                    <div className="mt-2 text-center">
                      <img src={formData.image} alt="Preview" className="h-32 mx-auto rounded-lg object-cover border border-gray-700" />
                    </div>
                  )}
                </div>

                {/* 2. MODEL OPTION */}
                <div className="space-y-1">
                  <label className="text-xs font-bold text-gray-400">2. Model</label>
                  <input 
                    type="text" 
                    placeholder="Enter Item Model / Code" 
                    value={formData.model} 
                    onChange={(e) => setFormData({ ...formData, model: e.target.value })} 
                    required 
                    className="w-full p-2.5 text-xs bg-[#0D1B2A] border border-gray-800 rounded-lg text-white focus:border-[#2ECC71] outline-none" 
                  />
                </div>

                {/* 3. DESCRIPTION OPTION */}
                <div className="space-y-1">
                  <label className="text-xs font-bold text-gray-400">3. Description</label>
                  <textarea 
                    placeholder="Enter Item Description" 
                    value={formData.description} 
                    onChange={(e) => setFormData({ ...formData, description: e.target.value })} 
                    required 
                    className="w-full p-2.5 text-xs bg-[#0D1B2A] border border-gray-800 rounded-lg text-white focus:border-[#2ECC71] outline-none h-24"
                  ></textarea>
                </div>

                <button type="submit" className="w-full bg-[#2ECC71] hover:bg-[#27ae60] text-black font-extrabold py-3 rounded-xl shadow-lg transition">
                  {editingItemId ? 'Update Item Record' : 'Save Item Record'}
                </button>
              </form>
            )}

            {/* VIEW 3: SAVED ITEMS STORE CATALOG */}
            {view === 'savedItems' && (
              <div className="space-y-3">
                <h2 className="text-base font-bold text-white">Item Store Catalog</h2>

                <div className="bg-[#1B2A4A] p-3 rounded-xl border border-gray-800">
                  <input 
                    type="text" 
                    placeholder="🔍 Search by Model or Description..." 
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full p-2.5 text-xs bg-[#0D1B2A] border border-gray-800 rounded-lg text-white focus:border-[#2ECC71] outline-none"
                  />
                </div>

                {searchedItems.length === 0 ? (
                  <div className="text-center py-8 text-gray-500 text-xs">No items found in the store.</div>
                ) : (
                  <div className="grid grid-cols-1 gap-3">
                    {searchedItems.map(item => (
                      <div key={item.id} className="bg-[#1B2A4A] p-4 rounded-xl border border-gray-800 shadow-md flex gap-4 items-center">
                        {item.image ? (
                          <img src={item.image} alt={item.model} className="w-20 h-20 object-cover rounded-lg border border-gray-700 flex-shrink-0" />
                        ) : (
                          <div className="w-20 h-20 bg-[#0D1B2A] rounded-lg border border-gray-800 flex items-center justify-center text-gray-500 text-xs flex-shrink-0">
                            No Image
                          </div>
                        )}
                        <div className="flex-1 min-w-0">
                          <h3 className="font-bold text-base text-[#2ECC71] truncate">{item.model}</h3>
                          <p className="text-xs text-gray-300 mt-1 line-clamp-2">{item.description}</p>
                          <div className="flex gap-2 mt-3">
                            <button onClick={() => handleEditItem(item)} className="text-[11px] bg-blue-500/10 text-blue-400 px-2.5 py-1 rounded border border-blue-500/30">✏️ Edit</button>
                            <button onClick={() => handleDeleteItem(item.id)} className="text-[11px] bg-[#E74C3C]/10 text-[#E74C3C] px-2.5 py-1 rounded border border-[#E74C3C]/30">🗑️ Delete</button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

          </main>

          {/* FLOATING BOTTOM NAVIGATION BAR */}
          <nav className="fixed bottom-0 left-0 right-0 bg-[#1B2A4A] border-t border-gray-800 py-3 px-6 flex justify-around items-center z-40 shadow-2xl">
            <button onClick={() => setView('dashboard')} className={`flex flex-col items-center gap-1 ${view === 'dashboard' ? 'text-[#2ECC71]' : 'text-gray-400'}`}>
              <span className="text-lg">🏠</span>
              <span className="text-[10px] font-bold">Home</span>
            </button>
            <button onClick={() => checkAuthAndAction(() => { setEditingItemId(null); setFormData(initialFormState); setView('addItem'); })} className={`flex flex-col items-center gap-1 ${view === 'addItem' ? 'text-[#2ECC71]' : 'text-gray-400'}`}>
              <span className="text-lg">➕</span>
              <span className="text-[10px] font-bold">Add Item</span>
            </button>
            <button onClick={() => setView('savedItems')} className={`flex flex-col items-center gap-1 ${view === 'savedItems' ? 'text-[#2ECC71]' : 'text-gray-400'}`}>
              <span className="text-lg">📦</span>
              <span className="text-[10px] font-bold">Store Catalog</span>
            </button>
          </nav>

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<KaizSooqApp />);
  </script>
</body>
</html>
